{% extends "base.html" %}
{% block title %}Conceptos Compras{% endblock %}

{% block content %}
<h5 class="fw-bold mb-3"><i class="bi bi-bag"></i> Conceptos de Compras</h5>

<div class="row g-3">
    <div class="col-md-5">
        <div class="card p-3">
            <h6 class="fw-bold">Agregar / Editar</h6>
            <form method="POST" action="{{ url_for('catalogos.conceptos_compras_guardar') }}">
                <input type="hidden" name="id" id="cc_id">
                <div class="mb-2">
                    <input type="text" name="nombre" id="cc_nombre" class="form-control form-control-sm" required placeholder="Nombre del concepto">
                </div>
                <div class="mb-2">
                    <input type="text" name="descripcion" id="cc_desc" class="form-control form-control-sm" placeholder="Descripción">
                </div>
                <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-check"></i> Guardar</button>
            </form>
        </div>
    </div>
    <div class="col-md-7">
        <div class="card">
            <div class="table-responsive">
                <table class="table table-sm table-hover mb-0">
                    <thead class="table-light"><tr><th>Concepto</th><th>Estado</th><th></th></tr></thead>
                    <tbody>
                        {% for c in conceptos %}
                        <tr class="{{ 'text-muted' if not c.activo else '' }}">
                            <td>{{ c.nombre }}</td>
                            <td><span class="badge {{ 'bg-success' if c.activo else 'bg-secondary' }}">{{ 'Activo' if c.activo else 'Inactivo' }}</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-secondary py-0" onclick="editarCC({{ c.id }}, '{{ c.nombre }}', '{{ c.descripcion or '' }}')"><i class="bi bi-pencil"></i></button>
                                <form method="POST" action="{{ url_for('catalogos.conceptos_compras_toggle', id=c.id) }}" class="d-inline">
                                    <button class="btn btn-sm btn-outline-{{ 'warning' if c.activo else 'success' }} py-0"><i class="bi bi-{{ 'pause' if c.activo else 'play' }}"></i></button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function editarCC(id, nombre, desc) {
    document.getElementById('cc_id').value = id;
    document.getElementById('cc_nombre').value = nombre;
    document.getElementById('cc_desc').value = desc;
}
</script>
{% endblock %}
