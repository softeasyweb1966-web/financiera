{% extends 'base.html' %}
{% block title %}Cambiar clave{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">Cambiar clave</h1>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Clave actual</label>
                        <input type="password" name="password_actual" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nueva clave</label>
                        <input type="password" name="password" class="form-control" minlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirmar nueva clave</label>
                        <input type="password" name="password_confirm" class="form-control" minlength="8" required>
                    </div>
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-secondary" href="{{ url_for('main.index') }}">
                            <i class="bi bi-arrow-left"></i> Volver
                        </a>
                        <button class="btn btn-primary flex-grow-1" type="submit">
                            <i class="bi bi-key"></i> Actualizar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
